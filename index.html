<body><div class="wrap">
<div class="top"><h1>自分</h1><p>あなたの前世の一生が、ここにある</p></div>
<form id="f">
<label>名前<input id="nm" placeholder="例：山田太郎" autocomplete="off" required></label>
<label>誕生日<input id="bd" type="date" value="2000-01-01" required></label>
<label>生まれた市町村区<input id="pl" placeholder="例：江東区、府中市、横浜市中区" autocomplete="off" required><span class="cand" id="cand"></span></label>
<div class="err" id="err"></div>
<button id="go" disabled>読みこみ中…</button>
</form>
<div id="out"></div>
<p class="note">人生のできごとは、時代と土地に合わせて組み立てた架空のものです。紫の行は、その時代・その土地で実際にあったできごとです。子どものうちに亡くなる人の割合も、当時に合わせています。同じ名前・誕生日・市町村区なら、いつでも同じ前世が出ます。<br>
